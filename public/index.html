<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Block Barons</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Вход -->
<section id="scr-login" class="screen active">
  <div class="card center">
    <h1>BLOCK<span>BARONS</span></h1>
    <p class="muted">Настольная игра про крипто-ферму: майнь, торгуй на бирже, бери кредиты и переиграй соперников</p>
    <input id="nameInput" maxlength="16" placeholder="Твой ник" autocomplete="off">
    <button id="btnEnter" class="btn primary">Войти</button>
  </div>
</section>

<!-- Меню -->
<section id="scr-menu" class="screen">
  <div class="card center">
    <h1>BLOCK<span>BARONS</span></h1>
    <div class="muted" id="whoami"></div>
    <button id="btnPractice" class="btn primary">Тренировка с ботами</button>
    <button id="btnLive" class="btn">Живые игроки <span id="lockIcon">🔒</span></button>
    <div id="lockNote" class="note"></div>
    <button id="btnHow" class="btn ghost">Как играть</button>
  </div>
</section>

<!-- Список лобби -->
<section id="scr-lobbies" class="screen">
  <div class="card wide">
    <div class="row between"><h2>Живые лобби</h2><button id="btnBackMenu" class="btn ghost small">← Меню</button></div>
    <div id="lobbyList" class="list"></div>
    <div class="row">
      <input id="codeInput" maxlength="4" placeholder="Код" class="code">
      <button id="btnJoinCode" class="btn">Войти по коду</button>
      <button id="btnNewLobby" class="btn primary">Создать лобби</button>
    </div>
  </div>
</section>

<!-- Создание лобби -->
<section id="scr-create" class="screen">
  <div class="card">
    <h2>Новое лобби</h2>
    <label>Название<input id="cName" maxlength="24" placeholder="Моя комната"></label>
    <label>Тип
      <select id="cPrivate"><option value="0">Открытое</option><option value="1">Закрытое (по коду)</option></select>
    </label>
    <label>Игроков (2–6)<input id="cMax" type="number" min="2" max="6" value="4"></label>
    <label>Раундов (5–40)<input id="cRounds" type="number" min="5" max="40" value="12"></label>
    <label>Стартовые деньги<input id="cCash" type="number" min="500" max="5000" step="100" value="1000"></label>
    <label class="check"><input id="cBots" type="checkbox" checked> Добавить ботов до полного состава</label>
    <div class="row"><button id="btnCreateBack" class="btn ghost">Отмена</button><button id="btnCreate" class="btn primary">Создать</button></div>
  </div>
</section>

<!-- Ожидание -->
<section id="scr-room" class="screen">
  <div class="card">
    <h2 id="roomTitle"></h2>
    <div class="muted" id="roomInfo"></div>
    <div id="roomCode" class="roomcode"></div>
    <div id="roomPlayers" class="list"></div>
    <div class="row"><button id="btnLeaveRoom" class="btn ghost">Выйти</button><button id="btnStart" class="btn primary">Начать игру</button></div>
  </div>
</section>

<!-- Игра -->
<section id="scr-game" class="screen gamescr">
  <div class="gamewrap">
    <div class="boardbox">
      <div id="board" class="board">
        <div id="center" class="center-area">
          <div class="logo">BLOCK<span>BARONS</span></div>
          <div id="rates" class="rates"></div>
          <div class="dicebox"><div id="die1" class="die">⚀</div><div id="die2" class="die">⚀</div></div>
          <div id="turnInfo" class="turninfo"></div>
          <div id="crisisInfo" class="crisisinfo"></div>
          <div id="sqInfo" class="sqinfo">Нажми на клетку, чтобы увидеть, что она делает</div>
        </div>
      </div>
    </div>
    <div class="panel">
      <div class="row between">
        <div><b id="gRound"></b> <span class="muted" id="gFlags"></span></div>
        <div class="row"><span id="gTimer" class="timer"></span><button id="btnQuit" class="btn ghost small">Выйти</button></div>
      </div>
      <div id="gPlayers" class="players"></div>
      <div id="myGoal" class="goal"></div>
      <div id="actions" class="actions"></div>
      <div id="market" class="market"></div>
      <div id="farm" class="farm"></div>
      <div id="gLog" class="log"></div>
    </div>
  </div>
</section>

<!-- Аукцион -->
<div id="auction" class="modal hidden">
  <div class="card">
    <h2>🔨 Аукцион</h2>
    <div id="aucCard" class="auccard"></div>
    <div class="muted" id="aucInfo"></div>
    <div class="row"><input id="aucBid" type="number" min="0" step="10" value="0"><button id="aucBtn" class="btn primary">Поставить</button><button id="aucPass" class="btn ghost">Пас</button></div>
    <div id="aucWho" class="muted"></div>
    <div id="aucTimer" class="timer"></div>
  </div>
</div>

<!-- Итоги -->
<section id="scr-end" class="screen">
  <div class="card">
    <h2 id="endTitle"></h2>
    <div id="endList" class="list"></div>
    <div id="endNote" class="note"></div>
    <button id="btnEndMenu" class="btn primary">В меню</button>
  </div>
</section>

<!-- Обучение -->
<div id="tutorial" class="modal hidden">
  <div class="card">
    <div class="muted" id="tStep"></div>
    <h2 id="tTitle"></h2>
    <p id="tText"></p>
    <div class="row between">
      <button id="tSkip" class="btn ghost small">Пропустить</button>
      <div class="row"><button id="tBack" class="btn small">Назад</button><button id="tNext" class="btn primary small">Дальше</button></div>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>
<script src="app.js"></script>
</body>
</html>
